# Local development: same image, but Django's auto-reloading runserver and the source
# mounted into the container, so edits show up without a rebuild.
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./myproject:/app/myproject
    restart: unless-stopped
