services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    volumes:
      - .:/app
      - static_volume:/app/myproject/staticfiles_production
    restart: unless-stopped

volumes:
  static_volume:



  # volumes: .:/app. What does that do?"

# It mirrors my local code folder into the container in real-time. 
# Without this, I would have to rebuild the Docker image every time I saved a file to see the changes. 
#This allows for instant feedback while developing."